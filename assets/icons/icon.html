<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="utf-8" />
  <style>
    @font-face {
      font-family: "Noto Serif Bengali";
      font-weight: 700;
      src: url("../fonts/NotoSerifBengali-Bold.ttf") format("truetype");
    }
    html, body { margin: 0; width: 256px; height: 256px; overflow: hidden; }
    .icon {
      width: 256px;
      height: 256px;
      background: linear-gradient(160deg, #2a8a68 0%, #1d5a47 70%, #163f34 100%);
      display: grid;
      place-items: center;
      position: relative;
    }
    .icon::after {
      content: "";
      position: absolute;
      inset: 14px;
      border: 2px solid rgba(244, 239, 228, 0.22);
      border-radius: 18px;
    }
    .glyph {
      font-family: "Noto Serif Bengali", serif;
      font-weight: 700;
      font-size: 148px;
      line-height: 1;
      color: #f4efe4;
      transform: translateY(-6px);
    }
  </style>
</head>
<body>
  <div class="icon"><span class="glyph">লি</span></div>
</body>
</html>
