<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="utf-8" />
  <title>লিপিশিল্প — LinkedIn</title>
  <style>
    @font-face {
      font-family: "Noto Serif Bengali";
      font-weight: 400;
      src: url("../fonts/NotoSerifBengali-Regular.ttf") format("truetype");
    }
    @font-face {
      font-family: "Noto Serif Bengali";
      font-weight: 700;
      src: url("../fonts/NotoSerifBengali-Bold.ttf") format("truetype");
    }
    @font-face {
      font-family: "Hind Siliguri";
      font-weight: 400;
      src: url("../fonts/HindSiliguri-Regular.woff2") format("woff2");
    }
    @font-face {
      font-family: "Tiro Bangla";
      font-weight: 400;
      src: url("../fonts/TiroBangla-Regular.woff2") format("woff2");
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 1584px; height: 396px; overflow: hidden; }
    .banner {
      width: 1584px;
      height: 396px;
      position: relative;
      overflow: hidden;
      background:
        radial-gradient(780px 280px at 10% 120%, rgba(32, 100, 79, 0.16), transparent 58%),
        radial-gradient(520px 240px at 92% -20%, rgba(196, 154, 78, 0.15), transparent 55%),
        linear-gradient(110deg, #f7f3e8 0%, #eef4ec 50%, #e3eee6 100%);
      color: #243830;
    }
    .banner::before {
      content: "লি";
      position: absolute;
      right: -20px;
      bottom: -150px;
      font-family: "Noto Serif Bengali", serif;
      font-weight: 700;
      font-size: 420px;
      color: rgba(32, 100, 79, 0.07);
      line-height: 1;
    }
    .rail {
      position: absolute;
      inset: 0 auto 0 0;
      width: 12px;
      background: linear-gradient(180deg, #2a8a68, #1d5a47 55%, #c49a4e);
    }
    .copy {
      position: absolute;
      left: 64px;
      top: 58px;
      width: 980px;
      z-index: 2;
    }
    .kicker {
      display: inline-block;
      font-family: "Hind Siliguri", sans-serif;
      font-size: 16px;
      letter-spacing: 0.16em;
      color: #1d5a47;
      background: rgba(32, 100, 79, 0.08);
      border: 1px solid rgba(32, 100, 79, 0.16);
      padding: 4px 12px 5px;
      border-radius: 999px;
      margin-bottom: 10px;
    }
    h1 {
      font-family: "Noto Serif Bengali", serif;
      font-weight: 700;
      font-size: 78px;
      line-height: 1;
      color: #1a3d34;
    }
    .row {
      display: flex;
      align-items: baseline;
      gap: 18px;
      margin-top: 6px;
    }
    .tagline {
      font-family: "Tiro Bangla", "Noto Serif Bengali", serif;
      font-size: 28px;
      color: #3d5a4c;
    }
    .sub {
      font-family: "Hind Siliguri", sans-serif;
      font-size: 20px;
      color: #4a6558;
    }
    .pills { display: flex; gap: 8px; margin-top: 22px; }
    .pill {
      font-family: "Hind Siliguri", sans-serif;
      font-size: 17px;
      color: #1d5a47;
      background: #fff;
      border: 1px solid rgba(32, 100, 79, 0.16);
      padding: 5px 14px 6px;
      border-radius: 999px;
      box-shadow: 0 6px 16px rgba(36, 56, 48, 0.06);
    }
    .page {
      position: absolute;
      right: 72px;
      top: 48px;
      width: 360px;
      height: 300px;
      background: #fffdf8;
      border: 1px solid rgba(36, 56, 48, 0.08);
      box-shadow: 0 16px 36px rgba(36, 56, 48, 0.12);
      transform: rotate(-2deg);
      padding: 24px 22px;
      font-family: "Noto Serif Bengali", serif;
      color: #5a6d62;
      font-size: 16px;
      line-height: 1.7;
      z-index: 2;
    }
    .page .rule { width: 56px; height: 4px; background: #c49a4e; margin-bottom: 12px; border-radius: 2px; }
    .page strong { display: block; color: #1d5a47; font-size: 18px; margin-bottom: 6px; }
  </style>
</head>
<body>
  <div class="banner">
    <div class="rail"></div>
    <div class="copy">
      <div class="kicker">WORDPRESS PLUGIN</div>
      <h1>লিপিশিল্প</h1>
      <div class="row">
        <p class="tagline">লেখার নিজস্ব ঠিকানা</p>
        <p class="sub">Bengali &amp; English manuscript studio</p>
      </div>
      <div class="pills">
        <span class="pill">Offline proofread</span>
        <span class="pill">Chapter studio</span>
        <span class="pill">Book format</span>
      </div>
    </div>
    <div class="page">
      <div class="rule"></div>
      <strong>খসড়া · প্রথম অধ্যায়</strong>
      আপনার শব্দ। আপনার স্বর। লিপিশিল্পে লিখুন নির্ভয়ে, সংশোধন করুন নিরিবিলি।
    </div>
  </div>
</body>
</html>
