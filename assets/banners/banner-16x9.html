<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="utf-8" />
  <title>লিপিশিল্প হিরো ব্যানার</title>
  <style>
    @font-face {
      font-family: "Noto Serif Bengali";
      font-weight: 400;
      src: url("../fonts/NotoSerifBengali-Regular.ttf") format("truetype");
    }
    @font-face {
      font-family: "Noto Serif Bengali";
      font-weight: 700;
      src: url("../fonts/NotoSerifBengali-Bold.ttf") format("truetype");
    }
    @font-face {
      font-family: "Hind Siliguri";
      font-weight: 400;
      src: url("../fonts/HindSiliguri-Regular.woff2") format("woff2");
    }
    @font-face {
      font-family: "Tiro Bangla";
      font-weight: 400;
      src: url("../fonts/TiroBangla-Regular.woff2") format("woff2");
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 1920px; height: 1080px; overflow: hidden; }
    .banner {
      width: 1920px;
      height: 1080px;
      position: relative;
      overflow: hidden;
      background:
        radial-gradient(1200px 700px at 12% 100%, rgba(32, 100, 79, 0.16), transparent 58%),
        radial-gradient(900px 520px at 90% 0%, rgba(196, 154, 78, 0.14), transparent 52%),
        linear-gradient(120deg, #f7f3e8 0%, #eef4ec 46%, #e3eee6 100%);
      color: #243830;
    }
    .banner::before {
      content: "লি";
      position: absolute;
      right: -30px;
      bottom: -140px;
      font-family: "Noto Serif Bengali", serif;
      font-weight: 700;
      font-size: 720px;
      color: rgba(32, 100, 79, 0.06);
      line-height: 1;
    }
    .rail {
      position: absolute;
      inset: 0 auto 0 0;
      width: 18px;
      background: linear-gradient(180deg, #2a8a68, #1d5a47 55%, #c49a4e);
    }
    .copy {
      position: absolute;
      left: 120px;
      top: 210px;
      width: 980px;
      z-index: 2;
    }
    .kicker {
      display: inline-block;
      font-family: "Hind Siliguri", sans-serif;
      font-size: 28px;
      letter-spacing: 0.16em;
      color: #1d5a47;
      background: rgba(32, 100, 79, 0.08);
      border: 1px solid rgba(32, 100, 79, 0.16);
      padding: 8px 18px 10px;
      border-radius: 999px;
      margin-bottom: 28px;
    }
    h1 {
      font-family: "Noto Serif Bengali", serif;
      font-weight: 700;
      font-size: 168px;
      line-height: 1;
      color: #1a3d34;
    }
    .tagline {
      margin-top: 18px;
      font-family: "Tiro Bangla", "Noto Serif Bengali", serif;
      font-size: 48px;
      color: #3d5a4c;
    }
    .sub {
      margin-top: 20px;
      max-width: 860px;
      font-family: "Hind Siliguri", sans-serif;
      font-size: 32px;
      line-height: 1.45;
      color: #4a6558;
    }
    .pills { display: flex; gap: 14px; margin-top: 42px; }
    .pill {
      font-family: "Hind Siliguri", sans-serif;
      font-size: 26px;
      color: #1d5a47;
      background: #fff;
      border: 1px solid rgba(32, 100, 79, 0.16);
      padding: 10px 22px 12px;
      border-radius: 999px;
      box-shadow: 0 8px 20px rgba(36, 56, 48, 0.06);
    }
    .pages { position: absolute; right: 110px; top: 220px; width: 680px; height: 640px; z-index: 2; }
    .page {
      position: absolute;
      width: 460px;
      height: 520px;
      background: #fffdf8;
      border: 1px solid rgba(36, 56, 48, 0.08);
      box-shadow: 0 24px 50px rgba(36, 56, 48, 0.12);
      padding: 42px 38px;
      font-family: "Noto Serif Bengali", serif;
      color: #5a6d62;
      font-size: 24px;
      line-height: 1.8;
    }
    .page.back { right: 0; top: 46px; transform: rotate(7deg); background: #f3eee0; }
    .page.front { right: 78px; top: 0; transform: rotate(-3deg); }
    .page .rule { width: 88px; height: 5px; background: #c49a4e; margin-bottom: 22px; border-radius: 3px; }
    .page strong { display: block; color: #1d5a47; font-size: 30px; margin-bottom: 12px; }
  </style>
</head>
<body>
  <div class="banner">
    <div class="rail"></div>
    <div class="copy">
      <div class="kicker">ওয়ার্ডপ্রেস প্লাগিন</div>
      <h1>লিপিশিল্প</h1>
      <p class="tagline">লেখার নিজস্ব ঠিকানা</p>
      <p class="sub">বাংলা ও ইংরেজি পাণ্ডুলিপি রচনা, সম্পাদনা ও প্রুফরিডিং স্টুডিও</p>
      <div class="pills">
        <span class="pill">অফলাইন প্রুফরিড</span>
        <span class="pill">অধ্যায় ব্যবস্থাপনা</span>
        <span class="pill">বই ফরম্যাট</span>
      </div>
    </div>
    <div class="pages">
      <div class="page back"></div>
      <div class="page front">
        <div class="rule"></div>
        <strong>খসড়া · প্রথম অধ্যায়</strong>
        আপনার শব্দ। আপনার স্বর। একটু যত্ন, প্রতিটি খসড়ায়। লিপিশিল্পে লিখুন নির্ভয়ে, সংশোধন করুন নিরিবিলি।
      </div>
    </div>
  </div>
</body>
</html>
