<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="utf-8" />
  <title>লিপিশিল্প — Facebook</title>
  <style>
    @font-face {
      font-family: "Noto Serif Bengali";
      font-weight: 400;
      src: url("../fonts/NotoSerifBengali-Regular.ttf") format("truetype");
    }
    @font-face {
      font-family: "Noto Serif Bengali";
      font-weight: 700;
      src: url("../fonts/NotoSerifBengali-Bold.ttf") format("truetype");
    }
    @font-face {
      font-family: "Hind Siliguri";
      font-weight: 400;
      src: url("../fonts/HindSiliguri-Regular.woff2") format("woff2");
    }
    @font-face {
      font-family: "Tiro Bangla";
      font-weight: 400;
      src: url("../fonts/TiroBangla-Regular.woff2") format("woff2");
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 1200px; height: 630px; overflow: hidden; }
    .banner {
      width: 1200px;
      height: 630px;
      position: relative;
      overflow: hidden;
      background:
        radial-gradient(720px 420px at 12% 110%, rgba(32, 100, 79, 0.18), transparent 58%),
        radial-gradient(560px 340px at 94% -8%, rgba(196, 154, 78, 0.16), transparent 54%),
        linear-gradient(118deg, #f7f3e8 0%, #eef4ec 48%, #e3eee6 100%);
      color: #243830;
    }
    .banner::before {
      content: "লি";
      position: absolute;
      right: -28px;
      bottom: -110px;
      font-family: "Noto Serif Bengali", serif;
      font-weight: 700;
      font-size: 460px;
      color: rgba(32, 100, 79, 0.07);
      line-height: 1;
    }
    .rail {
      position: absolute;
      inset: 0 auto 0 0;
      width: 12px;
      background: linear-gradient(180deg, #2a8a68, #1d5a47 55%, #c49a4e);
    }
    .copy {
      position: absolute;
      left: 64px;
      top: 86px;
      width: 640px;
      z-index: 2;
    }
    .kicker {
      display: inline-block;
      font-family: "Hind Siliguri", sans-serif;
      font-size: 17px;
      letter-spacing: 0.16em;
      color: #1d5a47;
      background: rgba(32, 100, 79, 0.08);
      border: 1px solid rgba(32, 100, 79, 0.16);
      padding: 5px 13px 6px;
      border-radius: 999px;
      margin-bottom: 16px;
    }
    h1 {
      font-family: "Noto Serif Bengali", serif;
      font-weight: 700;
      font-size: 92px;
      line-height: 1;
      color: #1a3d34;
    }
    .tagline {
      margin-top: 10px;
      font-family: "Tiro Bangla", "Noto Serif Bengali", serif;
      font-size: 30px;
      color: #3d5a4c;
    }
    .sub {
      margin-top: 12px;
      max-width: 580px;
      font-family: "Hind Siliguri", sans-serif;
      font-size: 21px;
      line-height: 1.4;
      color: #4a6558;
    }
    .pills { display: flex; gap: 8px; margin-top: 28px; flex-wrap: wrap; }
    .pill {
      font-family: "Hind Siliguri", sans-serif;
      font-size: 17px;
      color: #1d5a47;
      background: #fff;
      border: 1px solid rgba(32, 100, 79, 0.16);
      padding: 6px 14px 7px;
      border-radius: 999px;
      box-shadow: 0 6px 16px rgba(36, 56, 48, 0.06);
    }
    .pages { position: absolute; right: 48px; top: 92px; width: 430px; height: 450px; z-index: 2; }
    .page {
      position: absolute;
      width: 300px;
      height: 380px;
      background: #fffdf8;
      border: 1px solid rgba(36, 56, 48, 0.08);
      box-shadow: 0 18px 40px rgba(36, 56, 48, 0.12);
      padding: 28px 26px;
      font-family: "Noto Serif Bengali", serif;
      color: #5a6d62;
      font-size: 17px;
      line-height: 1.75;
    }
    .page.back { right: 0; top: 36px; transform: rotate(7deg); background: #f3eee0; }
    .page.front { right: 52px; top: 0; transform: rotate(-3deg); }
    .page .rule { width: 64px; height: 4px; background: #c49a4e; margin-bottom: 14px; border-radius: 2px; }
    .page strong { display: block; color: #1d5a47; font-size: 19px; margin-bottom: 8px; }
  </style>
</head>
<body>
  <div class="banner">
    <div class="rail"></div>
    <div class="copy">
      <div class="kicker">ওয়ার্ডপ্রেস প্লাগিন</div>
      <h1>লিপিশিল্প</h1>
      <p class="tagline">লেখার নিজস্ব ঠিকানা</p>
      <p class="sub">বাংলা ও ইংরেজি পাণ্ডুলিপি রচনা, সম্পাদনা ও প্রুফরিডিং স্টুডিও</p>
      <div class="pills">
        <span class="pill">অফলাইন প্রুফরিড</span>
        <span class="pill">অধ্যায় ব্যবস্থাপনা</span>
        <span class="pill">বই ফরম্যাট</span>
      </div>
    </div>
    <div class="pages">
      <div class="page back"></div>
      <div class="page front">
        <div class="rule"></div>
        <strong>খসড়া · প্রথম অধ্যায়</strong>
        আপনার শব্দ। আপনার স্বর। একটু যত্ন, প্রতিটি খসড়ায়। লিপিশিল্পে লিখুন নির্ভয়ে, সংশোধন করুন নিরিবিলি।
      </div>
    </div>
  </div>
</body>
</html>
