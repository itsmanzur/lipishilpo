<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="utf-8" />
  <title>লিপিশিল্প ব্যানার</title>
  <style>
    @font-face {
      font-family: "Noto Serif Bengali";
      font-weight: 400;
      src: url("../fonts/NotoSerifBengali-Regular.ttf") format("truetype");
    }
    @font-face {
      font-family: "Noto Serif Bengali";
      font-weight: 700;
      src: url("../fonts/NotoSerifBengali-Bold.ttf") format("truetype");
    }
    @font-face {
      font-family: "Hind Siliguri";
      font-weight: 400;
      src: url("../fonts/HindSiliguri-Regular.woff2") format("woff2");
    }
    @font-face {
      font-family: "Tiro Bangla";
      font-weight: 400;
      src: url("../fonts/TiroBangla-Regular.woff2") format("woff2");
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 1544px;
      height: 500px;
      overflow: hidden;
      background: #1a332c;
    }

    .banner {
      width: 1544px;
      height: 500px;
      position: relative;
      overflow: hidden;
      background:
        radial-gradient(900px 420px at 18% 110%, rgba(32, 100, 79, 0.18), transparent 60%),
        radial-gradient(700px 380px at 92% -10%, rgba(196, 154, 78, 0.16), transparent 55%),
        linear-gradient(115deg, #f7f3e8 0%, #eef4ec 48%, #e4eee6 100%);
      color: #243830;
    }

    .banner::before {
      content: "লি";
      position: absolute;
      right: -40px;
      bottom: -90px;
      font-family: "Noto Serif Bengali", serif;
      font-weight: 700;
      font-size: 420px;
      line-height: 1;
      color: rgba(32, 100, 79, 0.07);
      pointer-events: none;
    }

    .rail {
      position: absolute;
      inset: 0 auto 0 0;
      width: 14px;
      background: linear-gradient(180deg, #2a8a68, #1d5a47 55%, #c49a4e);
    }

    .grain {
      position: absolute;
      inset: 0;
      pointer-events: none;
      opacity: 0.18;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    }

    .copy {
      position: absolute;
      left: 72px;
      top: 78px;
      width: 820px;
      z-index: 2;
    }

    .kicker {
      display: inline-block;
      font-family: "Hind Siliguri", sans-serif;
      font-size: 20px;
      letter-spacing: 0.18em;
      color: #1d5a47;
      background: rgba(32, 100, 79, 0.08);
      border: 1px solid rgba(32, 100, 79, 0.16);
      padding: 6px 14px 7px;
      border-radius: 999px;
      margin-bottom: 18px;
    }

    h1 {
      font-family: "Noto Serif Bengali", serif;
      font-weight: 700;
      font-size: 112px;
      line-height: 1;
      color: #1a3d34;
      letter-spacing: -0.02em;
    }

    .tagline {
      margin-top: 10px;
      font-family: "Tiro Bangla", "Noto Serif Bengali", serif;
      font-size: 36px;
      color: #3d5a4c;
    }

    .sub {
      margin-top: 14px;
      font-family: "Hind Siliguri", sans-serif;
      font-size: 24px;
      color: #4a6558;
    }

    .pills {
      display: flex;
      gap: 10px;
      margin-top: 28px;
    }

    .pill {
      font-family: "Hind Siliguri", sans-serif;
      font-size: 20px;
      color: #1d5a47;
      background: #fff;
      border: 1px solid rgba(32, 100, 79, 0.16);
      padding: 7px 16px 8px;
      border-radius: 999px;
      box-shadow: 0 6px 16px rgba(36, 56, 48, 0.06);
    }

    .pages {
      position: absolute;
      right: 70px;
      top: 68px;
      width: 520px;
      height: 364px;
      z-index: 2;
    }

    .page {
      position: absolute;
      width: 340px;
      height: 300px;
      background: #fffdf8;
      border: 1px solid rgba(36, 56, 48, 0.08);
      box-shadow: 0 18px 40px rgba(36, 56, 48, 0.12);
      padding: 28px 26px 24px;
      font-family: "Noto Serif Bengali", serif;
      color: #5a6d62;
      font-size: 16px;
      line-height: 1.75;
    }

    .page.back {
      right: 18px;
      top: 28px;
      transform: rotate(7deg);
      background: #f3eee0;
    }

    .page.front {
      right: 72px;
      top: 8px;
      transform: rotate(-3deg);
    }

    .page .rule {
      width: 72px;
      height: 4px;
      background: #c49a4e;
      margin-bottom: 16px;
      border-radius: 2px;
    }

    .page strong {
      display: block;
      color: #1d5a47;
      font-size: 20px;
      margin-bottom: 8px;
    }
  </style>
</head>
<body>
  <div class="banner">
    <div class="rail"></div>
    <div class="grain"></div>
    <div class="copy">
      <div class="kicker">ওয়ার্ডপ্রেস প্লাগিন</div>
      <h1>লিপিশিল্প</h1>
      <p class="tagline">লেখার নিজস্ব ঠিকানা</p>
      <p class="sub">বাংলা ও ইংরেজি পাণ্ডুলিপি রচনা, সম্পাদনা ও প্রুফরিডিং স্টুডিও</p>
      <div class="pills">
        <span class="pill">অফলাইন প্রুফরিড</span>
        <span class="pill">অধ্যায় ব্যবস্থাপনা</span>
        <span class="pill">বই ফরম্যাট</span>
      </div>
    </div>
    <div class="pages">
      <div class="page back"></div>
      <div class="page front">
        <div class="rule"></div>
        <strong>খসড়া · প্রথম অধ্যায়</strong>
        আপনার শব্দ। আপনার স্বর। একটু যত্ন, প্রতিটি খসড়ায়। লিপিশিল্পে লিখুন নির্ভয়ে, সংশোধন করুন নিরিবিলি।
      </div>
    </div>
  </div>
</body>
</html>
